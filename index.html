<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stephens / Elliott Family Scholarship</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#16181c; --navy:#1b3a5c; --brass:#8a6e32;
    --muted:#59636e; --panel:#f4f2ed; --rule:#d8d4cb;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:#fff; color:var(--ink);
    font:400 18px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:36rem;margin:0 auto;padding:3.5rem 1.5rem 5rem}

  /* ---------- lock screen ---------- */
  #lock{max-width:24rem;margin:0 auto;padding:5rem 1.5rem}
  #lock h1{
    font-family:Georgia,"Times New Roman",serif; font-weight:400;
    font-size:2rem; line-height:1.15; color:var(--navy); margin:0 0 .4rem;
  }
  #lock p{color:var(--muted);font-size:1rem;margin:0 0 1.75rem}
  label{display:block;font-size:.95rem;font-weight:600;margin-bottom:.4rem}
  input[type=password]{
    width:100%; font-size:1.1rem; padding:.7rem .8rem;
    border:2px solid var(--rule); border-radius:3px; background:#fff; color:var(--ink);
  }
  input[type=password]:focus{outline:none;border-color:var(--navy)}
  button{
    font:inherit; font-size:1.02rem; font-weight:600; cursor:pointer;
    background:var(--navy); color:#fff; border:2px solid var(--navy);
    padding:.72rem 1.4rem; border-radius:3px; margin-top:1rem;
  }
  button:hover{background:#15304c}
  button:focus-visible,input:focus-visible,a:focus-visible{
    outline:3px solid var(--brass);outline-offset:3px
  }
  #err{color:#96331f;font-size:.95rem;margin-top:.9rem;min-height:1.4em}

  /* ---------- unlocked page ---------- */
  .names{
    font-family:Georgia,"Times New Roman",serif; font-weight:400;
    font-size:clamp(2.5rem,10vw,3.75rem); line-height:1.02;
    letter-spacing:-.015em; color:var(--navy); margin:0;
  }
  .names span{display:block}
  .names .amp{
    font-size:.5em;letter-spacing:.14em;color:var(--brass);
    padding-left:.16em;margin:.18em 0;
  }
  .kicker{font-family:Georgia,"Times New Roman",serif;font-size:1.3rem;margin:1.1rem 0 0}
  .founders{
    margin:.9rem 0 0;padding-top:.9rem;border-top:2px solid var(--brass);
    color:var(--muted);font-size:.95rem;line-height:1.5;
  }
  .lede{margin:2.2rem 0 0;font-size:1.06rem}
  .due{
    margin:1.2rem 0 0;padding:.7rem .9rem;background:var(--panel);
    border-left:4px solid var(--brass);font-size:1rem;
  }
  h2{
    font-family:Georgia,"Times New Roman",serif;font-weight:400;
    font-size:1.5rem;color:var(--navy);margin:3.2rem 0 1rem;
  }
  p{margin:0 0 1rem}
  a{color:var(--navy)}
  .get{
    display:block;border-left:4px solid var(--navy);background:var(--panel);
    padding:1.05rem 1.25rem;margin:0 0 .85rem;text-decoration:none;
    color:inherit;cursor:pointer;
  }
  .get:hover{background:#ebe8e0}
  .get b{
    display:block;font-weight:600;font-size:1.06rem;color:var(--navy);
    text-decoration:underline;text-underline-offset:3px;
  }
  .get span{display:block;color:var(--muted);font-size:.95rem;margin-top:.25rem;line-height:1.45}
  dl{margin:0;border-top:1px solid var(--rule)}
  dl div{border-bottom:1px solid var(--rule)}
  dt{font-weight:600;font-size:.95rem;color:var(--navy);padding-top:.85rem}
  dd{margin:.1rem 0 .85rem;font-size:.98rem}
  .fine{color:var(--muted);font-size:.95rem;margin-top:1rem}
  .how{margin:0 0 1.4rem;padding-left:1.3rem}
  .how li{margin-bottom:.5rem}
  footer{
    margin-top:4rem;padding-top:1.2rem;border-top:1px solid var(--rule);
    color:var(--muted);font-size:.9rem;
  }
  @media (max-width:30rem){
    body{font-size:17px}
    .wrap{padding:2.5rem 1.15rem 3.5rem}
    #lock{padding:3rem 1.15rem}
  }
</style>
</head>

</div>

const b64ToBytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));

async function unlock(password){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64ToBytes(VAULT.salt), iterations:VAULT.iterations, hash:"SHA-256"},
    baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:b64ToBytes(VAULT.iv)}, key, b64ToBytes(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function render(payload){
  const content = document.getElementById("content");
  content.innerHTML = payload.html;

  // Turn the embedded PDFs into real downloadable files.
  for (const f of payload.files){
    const bytes = b64ToBytes(f.b64);
    const url = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
    const a = content.querySelector('[data-file="' + f.id + '"]');
    if (a){ a.href = url; a.setAttribute("download", f.name); }
  }

  const btn = content.querySelector("#submitBtn");
  if (btn){
    btn.addEventListener("click", () => {
      window.location.href = "mailto:" + payload.emails.join(",")
        + "?subject=" + encodeURIComponent(payload.subject)
        + "&body=" + encodeURIComponent(payload.body);
    });
  }

  document.getElementById("lock").hidden = true;
  content.hidden = false;
  window.scrollTo(0, 0);
}

async function attempt(){
  const err = document.getElementById("err");
  const btn = document.getElementById("go");
  const pw = document.getElementById("pw").value;
  if (!pw){ err.textContent = "Enter the password to continue."; return; }
  err.textContent = "Checking\u2026";
  btn.disabled = true;
  try {
    render(await unlock(pw));
  } catch (e) {
    err.textContent = "That password didn't work. Check for capital letters and try again.";
    btn.disabled = false;
  }
}

document.getElementById("go").addEventListener("click", attempt);
document.getElementById("pw").addEventListener("keydown", e => {
  if (e.key === "Enter") attempt();
});
</script>
</body>
</html>
